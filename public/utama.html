<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Local Pest Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange-700: #c2410c;
      --orange-600: #ea580c;
      --orange-500: #f97316;
      --orange-400: #fb923c;
      --orange-100: #ffedd5;
      --orange-50: #fff7ed;
      --gray-700: #374151;
      --gray-500: #6b7280;
      --gray-200: #e5e7eb;
      --gray-100: #f3f4f6;
      --accent: #f97316;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff7ed 0%, #f3f4f6 50%, #ffffff 100%);
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(251,146,60,0.22) 0%, transparent 70%);
      top: -150px; left: -150px;
    }
    body::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(156,163,175,0.18) 0%, transparent 70%);
      bottom: -100px; right: -100px;
    }
    .card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.8);
      position: relative;
      z-index: 1;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .logo-img {
      width: 56px; height: 56px;
      object-fit: contain;
    }
    .logo-text h1 { color: var(--text); font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .logo-text p  { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .title { color: var(--text); font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 32px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; color: var(--gray-700); font-size: 12px; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
    input {
      width: 100%;
      background: var(--gray-100);
      border: 1.5px solid var(--gray-200);
      border-radius: 12px;
      color: var(--text);
      padding: 13px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    input::placeholder { color: #9ca3af; }
    input:focus { border-color: var(--orange-400); background: #fff; box-shadow: 0 0 0 3px rgba(251,146,60,0.18); }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--orange-500), var(--orange-400));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(249,115,22,0.28); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .footer-note { text-align: center; color: #9ca3af; font-size: 11px; margin-top: 28px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .captcha-row {
      display: flex; align-items: center; gap: 10px;
    }
    .captcha-question {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--orange-50);
      border: 1.5px solid #fed7aa;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 15px; font-weight: 700; color: var(--orange-600);
      letter-spacing: 1px; white-space: nowrap; flex-shrink: 0;
      font-family: 'Courier New', monospace;
    }
    .captcha-row input {
      flex: 1; text-align: center; font-size: 16px; font-weight: 600;
      letter-spacing: 2px;
    }
    .captcha-refresh {
      background: none; border: none; cursor: pointer;
      font-size: 18px; opacity: 0.6; transition: opacity 0.2s;
      padding: 4px; flex-shrink: 0;
    }
    .captcha-refresh:hover { opacity: 1; }
    .btn-order {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px;
      background: var(--orange-50);
      border: 1.5px solid #fdba74;
      border-radius: 12px;
      color: var(--orange-600);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      letter-spacing: 0.2px;
    }
    .btn-order:hover {
      background: var(--orange-100);
      border-color: var(--orange-500);
      box-shadow: 0 4px 16px rgba(249,115,22,0.15);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="Local.jpg" class="logo-img" alt="Logo Local Pest Control" style="border-radius: 10px;" />
      <div class="logo-text">
        <h1>Local Pest Control</h1>
        <p>CV. Kasuari Investama</p>
      </div>
    </div>
    <h2 class="title">Masuk</h2>
    <p class="subtitle">Masukkan kredensial Anda untuk melanjutkan</p>
    <div class="error-msg" id="errMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <div class="form-group">
        <label>Verifikasi Keamanan</label>
        <div class="captcha-row">
          <span class="captcha-question" id="captchaQuestion">…</span>
          <input type="number" id="captchaAnswer" placeholder="Jawaban" autocomplete="off" required />
          <button type="button" class="captcha-refresh" id="captchaRefresh" title="Soal baru">🔄</button>
        </div>
      </div>
      <button class="btn" type="submit" id="loginBtn">Masuk</button>
    </form>
    <div style="margin-top: 14px;">
      <a href="/formulir-pesanan.html" class="btn-order">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:7px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        Permintaan Estimasi Biaya/Survey
      </a>
    </div>
    <div style="margin-top: 10px;">
      <a href="/index.html" class="btn-order">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:7px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Halaman utama
      </a>
    </div>
    <p class="footer-note">© 2024 Local Pest Control · Sistem Internal</p>
  </div>
  <script>
    // If already logged in, redirect based on role
    fetch('/api/auth/me').then(r => {
      if (r.ok) r.json().then(d => {
        window.location.href = d.user.role === 'admin' ? '/dashboard.html' : '/form.html';
      });
    }).catch(() => {});

    // ── CAPTCHA ────────────────────────────────────────────────────────
    let captchaAnswer = 0;
    function generateCaptcha() {
      const ops = ['+', '-', '+', '+', '*'];
      const op  = ops[Math.floor(Math.random() * ops.length)];
      let a, b;
      if (op === '*') { a = Math.floor(Math.random() * 9) + 1; b = Math.floor(Math.random() * 9) + 1; }
      else if (op === '-') { a = Math.floor(Math.random() * 15) + 5; b = Math.floor(Math.random() * a); }
      else { a = Math.floor(Math.random() * 20) + 1; b = Math.floor(Math.random() * 20) + 1; }
      const sym = op === '*' ? '×' : op;
      document.getElementById('captchaQuestion').textContent = `${a} ${sym} ${b} = ?`;
      document.getElementById('captchaAnswer').value = '';
      captchaAnswer = op === '+' ? a + b : op === '-' ? a - b : a * b;
    }
    generateCaptcha();
    document.getElementById('captchaRefresh').addEventListener('click', generateCaptcha);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errMsg = document.getElementById('errMsg');

      // Validate captcha first
      const userAnswer = parseInt(document.getElementById('captchaAnswer').value, 10);
      if (userAnswer !== captchaAnswer) {
        errMsg.textContent = '❌ Jawaban verifikasi salah, coba lagi';
        errMsg.style.display = 'block';
        generateCaptcha();
        return;
      }
      errMsg.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Memproses...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = data.user.role === 'admin' ? '/dashboard.html' : '/form.html';
        } else {
          errMsg.textContent = data.error || 'Login gagal';
          errMsg.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Masuk';
        }
      } catch (err) {
        errMsg.textContent = 'Tidak dapat terhubung ke server';
        errMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
